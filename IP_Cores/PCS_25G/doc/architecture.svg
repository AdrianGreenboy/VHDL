<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#37474f"/>
    </marker>
    <marker id="arw" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="760" height="560" fill="#fafafa"/>

  <text x="380" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#212121">
    HERCOSSNUX Core 19 — PCS 64B/66B @ 25G
  </text>
  <text x="380" y="44" text-anchor="middle" font-size="11" fill="#616161">
    Trenz TE0950 · AMD Versal xcve2302-1LP · RV32 control plane · 390.625 MHz data plane
  </text>

  <!-- ================= PS ================= -->
  <rect x="24" y="62" width="200" height="118" rx="6" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1.6"/>
  <text x="124" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#283593">PS — Cortex-A72</text>
  <text x="124" y="99" text-anchor="middle" font-size="10" fill="#3949ab">PetaLinux · pcs-selftest</text>
  <rect x="40" y="110" width="168" height="26" rx="4" fill="#c5cae9" stroke="#3f51b5"/>
  <text x="124" y="127" text-anchor="middle" font-size="10" fill="#1a237e">carga fw_rv32.bin → IMEM</text>
  <rect x="40" y="142" width="168" height="26" rx="4" fill="#c5cae9" stroke="#3f51b5"/>
  <text x="124" y="159" text-anchor="middle" font-size="10" fill="#1a237e">sondea doorbell · lee DDR</text>

  <!-- ================= NoC / DDR ================= -->
  <rect x="536" y="62" width="200" height="118" rx="6" fill="#ede7f6" stroke="#673ab7" stroke-width="1.6"/>
  <text x="636" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#4527a0">NoC + DDR4</text>
  <rect x="552" y="96" width="168" height="30" rx="4" fill="#d1c4e9" stroke="#673ab7"/>
  <text x="636" y="109" text-anchor="middle" font-size="10" fill="#311b92">ventana no-map 16 MB</text>
  <text x="636" y="121" text-anchor="middle" font-size="10" fill="#311b92">0x7000_0000</text>
  <rect x="552" y="132" width="168" height="36" rx="4" fill="#d1c4e9" stroke="#673ab7"/>
  <text x="636" y="147" text-anchor="middle" font-size="10" fill="#311b92">resultados @ +0x40</text>
  <text x="636" y="160" text-anchor="middle" font-size="9" fill="#4527a0">ID · STATUS · CNT · BER · FLAGS</text>

  <!-- ================= PL: SoC ================= -->
  <rect x="24" y="206" width="712" height="330" rx="8" fill="#ffffff" stroke="#455a64" stroke-width="2"/>
  <text x="40" y="228" font-size="12" font-weight="bold" fill="#263238">PL — soc_top_pcs</text>

  <!-- axil_soc -->
  <rect x="44" y="242" width="150" height="86" rx="5" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/>
  <text x="119" y="261" text-anchor="middle" font-size="11" font-weight="bold" fill="#00695c">axil_soc</text>
  <text x="119" y="278" text-anchor="middle" font-size="9" fill="#00796b">CONTROL · IRQ</text>
  <text x="119" y="292" text-anchor="middle" font-size="9" fill="#00796b">DDR_BASE</text>
  <text x="119" y="306" text-anchor="middle" font-size="9" fill="#00796b">IMEM 0x1000</text>
  <text x="119" y="320" text-anchor="middle" font-size="9" fill="#00796b">DMEM 0x2000</text>

  <!-- RV32 -->
  <rect x="216" y="242" width="150" height="86" rx="5" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="291" y="261" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">RV32IM</text>
  <text x="291" y="277" text-anchor="middle" font-size="9" fill="#ef6c00">cpu_pipeline</text>
  <text x="291" y="291" text-anchor="middle" font-size="9" fill="#ef6c00">control plane</text>
  <text x="291" y="307" text-anchor="middle" font-size="9" fill="#ef6c00">IMEM 1 KB</text>
  <text x="291" y="321" text-anchor="middle" font-size="9" fill="#ef6c00">RAM local 256 w</text>

  <!-- mem_subsys_dma -->
  <rect x="388" y="242" width="150" height="86" rx="5" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="463" y="261" text-anchor="middle" font-size="11" font-weight="bold" fill="#6a1b9a">mem_subsys_dma</text>
  <text x="463" y="278" text-anchor="middle" font-size="9" fill="#8e24aa">RAM local + DMA</text>
  <text x="463" y="292" text-anchor="middle" font-size="9" fill="#8e24aa">local → DDR</text>
  <text x="463" y="308" text-anchor="middle" font-size="9" fill="#8e24aa">m_axi 40 bits</text>
  <text x="463" y="322" text-anchor="middle" font-size="9" fill="#8e24aa">doorbell DONE=127</text>

  <!-- puente MMIO -->
  <rect x="560" y="242" width="152" height="86" rx="5" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5"/>
  <text x="636" y="261" text-anchor="middle" font-size="11" font-weight="bold" fill="#ad1457">pcs_mmio_bridge</text>
  <text x="636" y="278" text-anchor="middle" font-size="9" fill="#c2185b">dmem → AXI4-Lite</text>
  <text x="636" y="292" text-anchor="middle" font-size="9" fill="#c2185b">ventana 0xD000_0000</text>
  <text x="636" y="308" text-anchor="middle" font-size="9" fill="#c2185b">estanca el CPU</text>
  <text x="636" y="322" text-anchor="middle" font-size="9" fill="#c2185b">hasta ready</text>

  <!-- ============ pcs_stats_top ============ -->
  <rect x="44" y="348" width="668" height="172" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="60" y="368" font-size="12" font-weight="bold" fill="#0d47a1">pcs_stats_top</text>

  <!-- dominio AXI -->
  <rect x="58" y="378" width="150" height="66" rx="4" fill="#bbdefb" stroke="#1976d2"/>
  <text x="133" y="396" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">pcs_regbank</text>
  <text x="133" y="411" text-anchor="middle" font-size="9" fill="#1565c0">AXI4-Lite · 64 regs</text>
  <text x="133" y="424" text-anchor="middle" font-size="9" fill="#1565c0">stickies IRQ (W1C)</text>
  <text x="133" y="437" text-anchor="middle" font-size="9" fill="#1565c0">FNV 0xD49A4DB4</text>

  <!-- CDC -->
  <rect x="224" y="378" width="132" height="66" rx="4" fill="#ffe0b2" stroke="#f57c00" stroke-width="1.5"/>
  <text x="290" y="396" text-anchor="middle" font-size="10" font-weight="bold" fill="#e65100">pcs_cdc</text>
  <text x="290" y="411" text-anchor="middle" font-size="9" fill="#ef6c00">2FF ASYNC_REG</text>
  <text x="290" y="424" text-anchor="middle" font-size="9" fill="#ef6c00">snapshot handshake</text>
  <text x="290" y="437" text-anchor="middle" font-size="9" fill="#ef6c00">toggle + cooldown</text>

  <!-- dataplane FSM -->
  <rect x="372" y="378" width="132" height="66" rx="4" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="438" y="396" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">pcs_dataplane</text>
  <text x="438" y="411" text-anchor="middle" font-size="9" fill="#2e7d32">block_lock (64)</text>
  <text x="438" y="424" text-anchor="middle" font-size="9" fill="#2e7d32">hi_ber · lock_time</text>
  <text x="438" y="437" text-anchor="middle" font-size="9" fill="#2e7d32">eventos</text>

  <!-- silicon datapath -->
  <rect x="520" y="378" width="178" height="128" rx="4" fill="#ffcdd2" stroke="#d32f2f" stroke-width="1.6"/>
  <text x="609" y="396" text-anchor="middle" font-size="10" font-weight="bold" fill="#b71c1c">pcs_silicon_datapath</text>
  <rect x="532" y="404" width="154" height="19" rx="3" fill="#ef9a9a" stroke="#c62828"/>
  <text x="609" y="417" text-anchor="middle" font-size="9" fill="#7f0000">PRBS31 gen → scrambler</text>
  <rect x="532" y="427" width="154" height="19" rx="3" fill="#ef9a9a" stroke="#c62828"/>
  <text x="609" y="440" text-anchor="middle" font-size="9" fill="#7f0000">gearbox TX 64→66</text>
  <rect x="532" y="450" width="154" height="19" rx="3" fill="#f8bbd0" stroke="#c2185b"/>
  <text x="609" y="463" text-anchor="middle" font-size="9" fill="#880e4f">loopback paralelo + INJ</text>
  <rect x="532" y="473" width="154" height="19" rx="3" fill="#ef9a9a" stroke="#c62828"/>
  <text x="609" y="486" text-anchor="middle" font-size="9" fill="#7f0000">gearbox RX → descrambler</text>
  <text x="609" y="502" text-anchor="middle" font-size="9" fill="#b71c1c">checker PRBS31 · FNV 0x50BA6983</text>

  <!-- etiquetas de dominio -->
  <line x1="360" y1="356" x2="360" y2="512" stroke="#9e9e9e" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="180" y="512" text-anchor="middle" font-size="9.5" fill="#616161">dominio AXI — clk_pl_0 40 MHz</text>
  <text x="470" y="512" text-anchor="middle" font-size="9.5" fill="#616161">dominio data plane — clk_dp 390.625 MHz</text>

  <!-- ================= conexiones ================= -->
  <line x1="124" y1="180" x2="124" y2="242" stroke="#37474f" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="130" y="200" font-size="9" fill="#37474f">AXI4-Lite 0xA400_0000</text>

  <line x1="194" y1="285" x2="216" y2="285" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="366" y1="285" x2="388" y2="285" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="538" y1="285" x2="560" y2="285" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/>

  <path d="M 636 242 L 636 196 L 636 180" fill="none" stroke="#37474f" stroke-width="1.8"/>
  <line x1="500" y1="196" x2="636" y2="196" stroke="#37474f" stroke-width="1.8"/>
  <line x1="500" y1="196" x2="500" y2="242" stroke="#37474f" stroke-width="1.8"/>
  <line x1="636" y1="196" x2="636" y2="182" stroke="#37474f" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="508" y="192" font-size="9" fill="#37474f">m_axi 40 bits → DDR</text>

  <line x1="636" y1="328" x2="636" y2="348" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="208" y1="411" x2="224" y2="411" stroke="#37474f" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="356" y1="411" x2="372" y2="411" stroke="#37474f" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="504" y1="411" x2="520" y2="411" stroke="#37474f" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- pie -->
  <text x="24" y="551" font-size="9.5" fill="#455a64">
    Silicon pass: BER = 0 sobre 1 823 313 palabras · inyección de 1 bit → 9 bits erróneos · WNS 0.000 / WHS 0.000 · CDC sin violaciones
  </text>
