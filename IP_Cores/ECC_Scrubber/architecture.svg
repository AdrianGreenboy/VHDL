<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowlite" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- title -->
  <rect x="0" y="0" width="760" height="560" fill="#f8fafc"/>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">HERCOSSNUX Core 20 — ECC Scrubber (SECDED 39,32)</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#475569">Silicon SoC on Trenz TE0950 (Versal xcve2302) — scrub loop over reserved DDR</text>

  <!-- ===== PS (CIPS) ===== -->
  <rect x="30" y="80" width="180" height="120" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="120" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">Processing System</text>
  <text x="120" y="118" text-anchor="middle" font-size="11" fill="#6d28d9">(Versal CIPS, aarch64)</text>
  <rect x="48" y="130" width="144" height="24" rx="4" fill="#ffffff" stroke="#a78bfa"/>
  <text x="120" y="146" text-anchor="middle" font-size="10.5" fill="#5b21b6">ecc-selftest (Linux)</text>
  <rect x="48" y="160" width="144" height="30" rx="4" fill="#ffffff" stroke="#a78bfa"/>
  <text x="120" y="174" text-anchor="middle" font-size="9.5" fill="#5b21b6">writes corrupt region,</text>
  <text x="120" y="185" text-anchor="middle" font-size="9.5" fill="#5b21b6">reads scrubbed region</text>

  <!-- ===== AXI-Lite slave ===== -->
  <rect x="30" y="230" width="180" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">AXI-Lite slave</text>
  <text x="120" y="268" text-anchor="middle" font-size="10" fill="#1d4ed8">axil_soc @ 0xA400_0000</text>
  <text x="120" y="284" text-anchor="middle" font-size="9.5" fill="#1d4ed8">CONTROL · STATUS</text>
  <text x="120" y="298" text-anchor="middle" font-size="9.5" fill="#1d4ed8">DDR_BASE · IMEM window</text>
  <text x="120" y="312" text-anchor="middle" font-size="9.5" fill="#1d4ed8">halt / release / load</text>

  <!-- ===== SoC master (big box) ===== -->
  <rect x="270" y="80" width="300" height="300" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="420" y="102" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#065f46">ecc_soc_si  (soc_top_master)</text>

  <!-- RV32 core -->
  <rect x="290" y="118" width="120" height="70" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="350" y="140" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#065f46">RV32IMA</text>
  <text x="350" y="155" text-anchor="middle" font-size="9.5" fill="#047857">cpu_pipeline v1.1</text>
  <text x="350" y="169" text-anchor="middle" font-size="9.5" fill="#047857">runs scrub loop</text>
  <text x="350" y="182" text-anchor="middle" font-size="9" fill="#047857">firmware in IMEM</text>

  <!-- Mem subsys + DMA -->
  <rect x="430" y="118" width="120" height="70" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="490" y="140" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#065f46">Mem + DMA</text>
  <text x="490" y="155" text-anchor="middle" font-size="9.5" fill="#047857">mem_subsys_dma</text>
  <text x="490" y="169" text-anchor="middle" font-size="9.5" fill="#047857">local RAM +</text>
  <text x="490" y="182" text-anchor="middle" font-size="9" fill="#047857">dma_burst (AXI4)</text>

  <!-- Scrubber register bank -->
  <rect x="290" y="205" width="260" height="155" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="420" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">Scrubber register bank (ecc_regbank_si)</text>

  <rect x="304" y="238" width="110" height="52" rx="5" fill="#ffffff" stroke="#f59e0b"/>
  <text x="359" y="257" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#92400e">SECDED codec</text>
  <text x="359" y="271" text-anchor="middle" font-size="9" fill="#b45309">ecc_codec_mmio</text>
  <text x="359" y="283" text-anchor="middle" font-size="9" fill="#b45309">encode / decode</text>

  <rect x="426" y="238" width="110" height="52" rx="5" fill="#ffffff" stroke="#f59e0b"/>
  <text x="481" y="257" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#92400e">Scrub FSM</text>
  <text x="481" y="271" text-anchor="middle" font-size="9" fill="#b45309">scrub_fsm +</text>
  <text x="481" y="283" text-anchor="middle" font-size="9" fill="#b45309">scrub_bram</text>

  <rect x="304" y="300" width="110" height="46" rx="5" fill="#ffffff" stroke="#f59e0b"/>
  <text x="359" y="318" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">CE / DED counters</text>
  <text x="359" y="332" text-anchor="middle" font-size="9" fill="#b45309">bump auto-increment</text>

  <rect x="426" y="300" width="110" height="46" rx="5" fill="#ffffff" stroke="#f59e0b"/>
  <text x="481" y="318" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">Data window</text>
  <text x="481" y="332" text-anchor="middle" font-size="9" fill="#b45309">0x1000+</text>

  <!-- ===== NoC ===== -->
  <rect x="270" y="415" width="300" height="55" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="420" y="438" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3730a3">AXI NoC</text>
  <text x="420" y="456" text-anchor="middle" font-size="10" fill="#4338ca">S06_AXI → C3_DDR_LOW0 / LOW1  (scripted Tcl, not auto-routed)</text>

  <!-- ===== DDR ===== -->
  <rect x="590" y="415" width="150" height="105" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="665" y="438" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">DDR memory</text>
  <text x="665" y="456" text-anchor="middle" font-size="10" fill="#b91c1c">reserved buffer</text>
  <text x="665" y="470" text-anchor="middle" font-size="10" fill="#b91c1c">0x7000_0000</text>
  <text x="665" y="484" text-anchor="middle" font-size="10" fill="#b91c1c">16 MB, no-map</text>
  <text x="665" y="504" text-anchor="middle" font-size="9" fill="#b91c1c">protected ECC region</text>

  <!-- ===== connections ===== -->
  <!-- PS to AXI-Lite -->
  <line x1="120" y1="200" x2="120" y2="230" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowlite)"/>
  <!-- AXI-Lite to SoC (control/imem) -->
  <line x1="210" y1="260" x2="270" y2="180" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowlite)"/>
  <text x="238" y="212" text-anchor="middle" font-size="8.5" fill="#7c3aed" transform="rotate(-38 238 212)">ctrl+IMEM</text>

  <!-- RV32 <-> Mem+DMA -->
  <line x1="410" y1="153" x2="430" y2="153" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="430" y1="165" x2="410" y2="165" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- RV32 -> scrubber bank (MMIO) -->
  <line x1="350" y1="188" x2="350" y2="205" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="393" y="200" text-anchor="middle" font-size="8.5" fill="#475569">MMIO 0x8000_0000</text>

  <!-- codec loop annotation between RV32 and codec -->
  <!-- DMA -> NoC -->
  <line x1="490" y1="188" x2="490" y2="360" stroke="#059669" stroke-width="0" />
  <line x1="420" y1="380" x2="420" y2="415" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="400" text-anchor="middle" font-size="9" fill="#475569">m_axi (AXI4 master, DMA)</text>

  <!-- NoC <-> DDR -->
  <line x1="570" y1="443" x2="590" y2="455" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="467" x2="570" y2="455" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- PS <-> DDR (write corrupt / read scrubbed) big dashed loop -->
  <path d="M 130 190 C 130 540, 590 540, 620 520" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="360" y="537" text-anchor="middle" font-size="9.5" fill="#b91c1c">PS writes corrupt region / reads scrubbed region (volatile, word-by-word)</text>

  <!-- scrub loop label -->
  <rect x="590" y="80" width="150" height="120" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="665" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Scrub loop</text>
  <text x="600" y="120" font-size="9" fill="#475569">1. DMA tile DDR→local</text>
  <text x="600" y="136" font-size="9" fill="#475569">2. decode each word</text>
  <text x="600" y="152" font-size="9" fill="#475569">3. correct CE, count DED</text>
  <text x="600" y="168" font-size="9" fill="#475569">4. DMA tile local→DDR</text>
  <text x="600" y="184" font-size="9" fill="#475569">5. doorbell → PS</text>

  <!-- footer -->
  <text x="380" y="552" text-anchor="middle" font-size="9" fill="#94a3b8">L5 silicon PASS: run A 0xbebc26d1 (scrub ON) ≠ run B 0xc91192e2 (scrub OFF) · synth WNS +19.09 ns · impl WNS +16.85 ns</text>
</svg>
